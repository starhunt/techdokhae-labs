<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>테크독해 · Local Search Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f4;color:#17333e;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}header{padding:25px 5%;display:flex;justify-content:space-between;background:#17333e;color:white}.brand{font-size:25px;font-weight:800}header span{color:#a8d3c9}main{max-width:1450px;margin:auto;padding:42px 35px}h1{font-size:42px;margin:0 0 12px}p{color:#657a80;line-height:1.6}.search{display:flex;gap:12px;margin:25px 0}input{flex:1;font:inherit;font-size:25px;padding:20px;border:2px solid #087f72;border-radius:10px;background:white}button,select{font:inherit;font-size:17px;border:1px solid #c4d5d0;border-radius:8px;padding:12px 18px;background:white;color:#25464e;cursor:pointer}button.active{background:#087f72;color:white}.queries{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.item{border-radius:12px;background:#fff;border:1px solid #d3dfdc;overflow:hidden;cursor:pointer}.item:first-child{outline:3px solid #087f72}.item img{width:100%;aspect-ratio:10/7;object-fit:contain;background:#eef1f5}.excerpt{height:285px;padding:22px;font-size:24px;line-height:1.55;color:#24424c;overflow:hidden}.row{padding:16px;display:flex;justify-content:space-between;font-weight:700}.score{color:#087f72}#status{font-size:18px;margin:20px 0}.notice{background:#fff0df;border-left:5px solid #d57840;padding:14px 20px;margin:20px 0;line-height:1.65}.controls{display:flex;gap:15px;align-items:center;justify-content:space-between}dialog{width:min(1000px,94vw);border:none;border-radius:18px;padding:25px}dialog::backdrop{background:#142b38aa}dialog img{width:100%}dialog pre{white-space:pre-wrap;font:22px/1.7 monospace}.close{float:right}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:24px 18px}h1{font-size:30px}.search input{width:100%;font-size:18px}.controls{align-items:start;flex-direction:column}}</style><header><div class="brand">테크독해 / LOCAL SEARCH LAB</div><span>EmbeddingGemma 2 · 직접 실행 결과</span></header><main><h1>이름 대신, 내용으로 찾기</h1><p>직접 만든 화면 6장과 문서 6개. 아래 질문을 고르면 실제 모델 추론 결과를 확인할 수 있습니다.</p><div class="search"><input id="query" readonly placeholder="질문을 선택하세요"><button id="run" class="active">결과 보기</button></div><div class="queries" id="queries"></div><div class="controls"><label>벡터 차원 <select id="dim"><option>768</option><option>256</option><option>128</option></select></label><span>코사인 유사도 · 정답 확률이 아닙니다</span></div><div id="status">실행 결과 불러오는 중…</div><div class="notice" id="notice">고정된 자체 예제의 실행 기록입니다. 공개 성능 벤치마크가 아닙니다.</div><div class="grid" id="results"></div></main><dialog id="detail"><button class="close" onclick="document.querySelector('dialog').close()">닫기</button><h2 id="detailTitle"></h2><div id="detailBody"></div></dialog><script>
let dataset,actual,selected=0,liveResult=null,live=false;const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(){const q=liveResult||actual.results[selected],d=$('#dim').value;$('#query').value=q.text;$('#status').textContent=liveResult?'새 질문 · 로컬 모델이 방금 계산한 결과':`질문 ${selected+1} / ${actual.results.length} · 12개 후보를 유사도 순으로 정렬`;$('#notice').textContent=(liveResult||q.expected.length)?'모델에 이미지 파일명·설명·정답 목록은 입력하지 않았습니다. 원문을 열어 내용을 확인하세요.':'이 질문의 답은 데이터에 없습니다. 그래도 가까운 후보는 반환됩니다. 검색 순위만으로 답을 확정하면 안 됩니다.';$('#results').innerHTML=q.rankings[d].slice(0,6).map((r,i)=>{const item=dataset.items.find(x=>x.id===r.id);return `<article class="item" data-id="${r.id}">${item.kind==='image'?`<img src="${item.path}">`:`<div class="excerpt">${esc(item.text)}</div>`}<div class="row"><span>${i+1}. ${item.id} · ${item.kind.toUpperCase()}</span><span class="score">${r.score.toFixed(4)}</span></div></article>`}).join('');document.querySelectorAll('.item').forEach(el=>el.onclick=()=>{const item=dataset.items.find(x=>x.id===el.dataset.id);$('#detailTitle').textContent=item.id+' · '+item.path;$('#detailBody').innerHTML=item.kind==='image'?`<img src="${item.path}">`:`<pre>${esc(item.text)}</pre>`;$('#detail').showModal()});document.querySelectorAll('.queries button').forEach((b,i)=>b.classList.toggle('active',i===selected));}
Promise.all([fetch('dataset.json').then(r=>r.json()),fetch('results.json').then(r=>r.json())]).then(([d,r])=>{dataset=d;actual=r;$('#queries').innerHTML=d.queries.map((q,i)=>`<button data-i="${i}">${i+1}. ${['장애 그래프','설계도','결제 재시도','사건 번호','청구서','저장공간','정상 상태','없는 정보'][i]}</button>`).join('');document.querySelectorAll('.queries button').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.i);liveResult=null;show()});$('#run').onclick=async()=>{if(!live){show();return;}$('#status').textContent='로컬 모델로 새 질문 계산 중…';const r=await fetch('/api/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:$('#query').value,dimension:Number($('#dim').value)})});const data=await r.json();if(!r.ok){$('#status').textContent=data.error;return;}liveResult=data;show();};$('#query').onkeydown=e=>{if(e.key==='Enter')$('#run').click();};$('#dim').onchange=()=>{if(liveResult)$('#run').click();else show();};show();window.ready=true;fetch('/api/health').then(r=>r.json()).then(h=>{if(h.live){live=true;$('#query').readOnly=false;$('#run').textContent='직접 검색';}}).catch(()=>{});}).catch(e=>{$('#status').textContent='먼저 python search.py를 실행해 results.json을 생성하세요.';console.error(e)});
</script></html>
